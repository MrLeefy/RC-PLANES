name: Restore RC Park binary assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact RC Park PNG assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android_assets
          curl -fsSL "https://rcbuild.129.146.39.132.sslip.io/rcplanes-assets/icon.png" -o icon.png
          curl -fsSL "https://rcbuild.129.146.39.132.sslip.io/rcplanes-assets/android_assets/icon_192.png" -o android_assets/icon_192.png
          curl -fsSL "https://rcbuild.129.146.39.132.sslip.io/rcplanes-assets/android_assets/adaptive_bg_432.png" -o android_assets/adaptive_bg_432.png
          curl -fsSL "https://rcbuild.129.146.39.132.sslip.io/rcplanes-assets/android_assets/adaptive_fg_432.png" -o android_assets/adaptive_fg_432.png

          echo "db9659e0083a4f556cf6d11b9d490b3b9de2cfa20aa0f7cd76378d54fd740841  icon.png" | sha256sum -c -
          echo "04cd478f124b4c675b30de369851e2248956648e206b5e5547e7b14319d23a51  android_assets/icon_192.png" | sha256sum -c -
          echo "f1533cecd452ac922f5471c00679d56c3e5e1f82f1416636fbd3f99a978a131c  android_assets/adaptive_bg_432.png" | sha256sum -c -
          echo "93ca230eb2f8d935b1b8ed3cdd115080a71ad8a788799a1ca42277c386ca2f5e  android_assets/adaptive_fg_432.png" | sha256sum -c -

      - name: Commit restored binary assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/restore-rcpark-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Restore RC Park binary assets"
          git push
