name: RCBeam validation
on:
  push:
    branches: [codex/structural-crash-realism]
  pull_request:
    paths: ['native/rcbeam/**', 'scripts/aircraft/**', 'tests/**', 'tools/**', '.github/workflows/rcbeam.yml']
  workflow_dispatch:
jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install scons==4.11.1
          git clone https://github.com/godotengine/godot-cpp.git native/rcbeam/godot/godot-cpp
          git -C native/rcbeam/godot/godot-cpp checkout ed672dc12ed37c8b361fe077285a094882ad0543
          cmake -S native/rcbeam -B build/rcbeam -DCMAKE_BUILD_TYPE=Release
          cmake --build build/rcbeam -j2
          ctest --test-dir build/rcbeam --output-on-failure
      - name: Build Godot 4.7 extension with native compiler architecture
        run: python -m SCons -C native/rcbeam/godot platform=linux target=template_debug -j2
      - name: Run extension and aircraft proof in Godot 4.7.2
        run: |
          python tools/install_rcbeam.py --platform linux --arch ${{ matrix.arch }}
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.${{ matrix.arch }}.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          /tmp/godot/Godot* --headless --path . --editor --import
          /tmp/godot/Godot* --headless --path . res://tests/rcbeam_test.tscn
      - uses: actions/upload-artifact@v4
        with:
          name: rcbeam-linux-${{ matrix.arch }}
          path: native/rcbeam/godot/bin/linux/*.so
